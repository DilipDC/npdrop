[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myml"
version = "0.3.0"
description = "Notebook-friendly machine-learning code templates and full-block source retrieval"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
notebook = ["ipython>=7"]
test = ["pytest>=7"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["myml*"]

[tool.setuptools.package-data]
myml = ["templates/*", "data/*", "*.pyi"]
